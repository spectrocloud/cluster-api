# Core CAPI fork (spectrocloud-public/cluster-api) — the CONTRACT owner + n-3 baseline.
# Upgrade this FIRST; providers' target contract/n-3 depend on it.
PROVIDER=capi
CORE_CAPI=1                 # engine: this repo IS sigs.k8s.io/cluster-api (no go.mod require) —
                           # discover the version from the release TAG, not a go.mod replace/require (needs engine Patch M).
UPSTREAM_URL=https://github.com/kubernetes-sigs/cluster-api.git
SPECTRO_SRC=origin/spectro-master
# Builds 3 images (ALL_DOCKER_BUILD): core · kubeadm-bootstrap · kubeadm-control-plane.
# vendorcrd 'capi' entry pulls 3 upstream components (core/bootstrap/control-plane).
# Classifier data (seed — tune on first triage):
MANDATORY_PATTERNS=Added Spectro Manifests|exclusive webhook|Spectro CICD|self hosted runner|RBAC|ServiceAccount
GENERATED_PATHS=config/|manifests/|zz_generated
F4_HOTSPOTS=
IMAGES=core kubeadm-bootstrap kubeadm-control-plane   # ALL_DOCKER_BUILD: build + imageswap all three (Patch: 3-image coverage)

# --- integration/validation tail (Spec Patch F-J) ---
# Core has no cloud of its own — CBT exercises core+CABPK+KCP via an AWS-backed cluster (adjust per cycle).
CLOUD=aws
CBT_FEATURE=lifecycle
VENDORCRD=config/vendorcrd/capi   # vendorcrd 'capi' entry pulls 3 upstream components; confirm dir in providers.yaml
